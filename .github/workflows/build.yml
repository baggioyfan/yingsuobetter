name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: 安装 Android SDK 组件
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-32" "build-tools;36.0.0" "platform-tools"

      - name: 写入 local.properties（密钥与 AK 均来自 Secret，不落盘到源码）
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}"
            echo "MAPS_SAFE_CODE=${{ secrets.MAPS_SAFE_CODE }}"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
          } > local.properties

      - name: 还原签名密钥（仓库不含 jks，仅从 Secret 解码到工作区）
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/GoGoGo.jks
            echo "签名密钥已注入（仅存在于本次运行的工作区）"
          else
            echo "::warning::未配置 SIGNING_KEYSTORE_BASE64，将产出未签名 APK"
          fi

      - name: 构建 release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: GoGoGo-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 清理工作区密钥
        if: always()
        run: rm -f keystore/GoGoGo.jks
